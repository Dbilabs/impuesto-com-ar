name: Calidad Fiscal, Contratos e Invariantes (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad-fiscal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de validación
        run: |
          pip install -q fastapi uvicorn pydantic cryptography httpx playwright

      - name: Gate 1 — Verificar sincronización Single Source de Skills
        run: |
          python3 scripts/sync_skills.py
          git diff --exit-code functions/mcp/skills_bundle.js || (echo "❌ skills_bundle.js desactualizado. Corré python3 scripts/sync_skills.py" && exit 1)

      - name: Gate 2 — Suite de Contratos, Imports e Invariantes Contables
        run: |
          python3 -m unittest discover -s tests -v

      - name: Gate 3 — Seguridad (Cero credenciales o bóvedas trackeadas en Git)
        run: |
          ! git ls-files | grep -E '(\.enc|\.key|\.vault_key|\.bot_secret|\.env)$'
